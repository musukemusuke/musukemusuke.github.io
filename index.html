    <script>
        // --- DOM Element Declarations ---
        const audioPlayer = document.getElementById('audio-player');
        const muteToggle = document.querySelector('#volume-container button');
        const volumeOn = document.getElementById('volume-on');
        const volumeOff = document.getElementById('volume-off');
        const volumeSlider = document.querySelector('#volume-container input');
        const container = document.querySelector('.container');
        const avatar = document.querySelector('.user-avatar');
        const title = document.querySelector('.profile-info h1');
        const links = document.querySelector('.link-list');
        const scrollContainer = document.getElementById('scroll-container');
        const navLinks = document.querySelectorAll('#scroll-nav a');
        const cards = Array.from(document.querySelectorAll('#scroll-container .card'));
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const albumArt = document.getElementById('album-art');
        const songTitle = document.getElementById('song-title');

        // プログレスバー関連のDOM要素を再宣言
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressFilled = document.getElementById('progress-filled');
        const timeDisplay = document.getElementById('time-display');

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) {
                return '--:--';
            }
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // --- Playlist ---
        const backgroundVideo = document.getElementById('background-video');
        const songs = [
            {
                title: 'Bad Apple!!',
                artist: 'nomico',
                src: 'music/badapple.m4a',
                cover: './images/album_art (1).png',
                url: 'https://www.youtube.com/watch?v=FtutLA63Cp8', // 公式影絵PV動画
                video: './videos/badapple_60fps.mp4' // 最適化済みH.264 60fps版背景動画のパス
            }
        ];

        // ブラウザのメモリセーバーによる一時停止を防ぐため、Page Visibility APIをオーバーライド
        try {
            Object.defineProperty(document, 'visibilityState', {
                get() { return 'visible'; }
            });
            Object.defineProperty(document, 'hidden', {
                get() { return false; }
            });
            // 古いブラウザ用の接頭辞付きプロパティも上書き
            if (typeof document.webkitHidden !== 'undefined') {
                Object.defineProperty(document, 'webkitHidden', {
                    get() { return false; }
                });
            }
            if (typeof document.mozHidden !== 'undefined') {
                Object.defineProperty(document, 'mozHidden', {
                    get() { return false; }
                });
            }
            // visibilitychangeイベント自体をブロックしてブラウザの一時停止を防止
            const blockVisibilityEvent = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            };
            document.addEventListener('visibilitychange', blockVisibilityEvent, true);
            document.addEventListener('webkitvisibilitychange', blockVisibilityEvent, true);
            document.addEventListener('mozvisibilitychange', blockVisibilityEvent, true);
        } catch(e) {
            console.log("Page Visibility APIのオーバーライドに失敗:", e);
        }

        // Spotify風の一元管理されたプレーヤークラスで全ての状態を管理
        class MediaPlayer {
            constructor() {
                // 再生状態を内部で一元管理
                this.isPlaying = false;
                this.currentSongIndex = 0;
                this.displayedTotalDuration = NaN;
                this.audio = audioPlayer;
                this.video = backgroundVideo;
                this.progress = progressFilled;
                this.initEventListeners();
            }

            // 全てのイベントリスナーをクラス内で登録して競合を防ぐ
            initEventListeners() {
                this.audio.addEventListener('timeupdate', () => this.handleTimeUpdate());
                this.audio.addEventListener('ended', () => this.playNext());
                document.addEventListener('visibilitychange', () => this.handleVisibilityChange());
                progressBar.addEventListener('click', (e) => this.handleProgressClick(e));
            }

            // 再生位置の同期処理を内部化
            handleTimeUpdate() {
                const currentTime = this.audio.currentTime;
                const duration = this.audio.duration;
                // 0.5秒以上のズレがある場合のみ同期
                if (!this.video.paused && Math.abs(this.video.currentTime - currentTime) > 0.5) {
                    this.video.currentTime = currentTime;
                }
                // プログレスバーの更新
                if (!isNaN(duration) && duration > 0) {
                    this.progress.style.width = `${(currentTime/duration)*100}%`;
                    timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(this.displayedTotalDuration)}`;
                }
            }

            // プログレスバークリック時の処理を内部化
            handleProgressClick(e) {
                const progressBarWidth = progressBar.clientWidth;
                const clickX = e.offsetX;
                const duration = this.audio.duration;
                if (!isNaN(duration)) {
                    const newTime = (clickX / progressBarWidth) * duration;
                    this.audio.currentTime = newTime;
                    if (!this.video.paused) {
                        this.video.currentTime = newTime;
                    }
                }
            }

            // タブ切り替え時の同期処理を強化してカクつきを完全に解消
            handleVisibilityChange() {
                if (!document.hidden && this.isPlaying) {
                    // ブラウザがバックグラウンドで停止していた場合、確実に再生を再開
                    if (this.audio.paused) {
                        this.audio.play().catch(e => console.error("音声再開エラー:", e));
                    }
                    if (this.video.paused) {
                        this.video.play().catch(e => console.error("動画再開エラー:", e));
                    }
                    // 音声の位置に完全に動画を同期させてから再生再開
                    this.video.currentTime = this.audio.currentTime;
                }
            }

            // 再生処理を単一のエントリポイントに集約
            play() {
                if (this.isPlaying) return; // 二重再生を完全に防止
                // 再生前にリセットせず、停止していた位置から続けて再生
                // ズレがある場合のみ現在の音声位置に動画を同期
                if (Math.abs(this.video.currentTime - this.audio.currentTime) > 0.1) {
                    this.video.currentTime = this.audio.currentTime;
                }
                // 同時再生で同期を保証
                Promise.all([this.audio.play(), this.video.play()]).then(() => {
                    this.isPlaying = true;
                    this.video.style.opacity = '0.5';
                    updatePlayPauseIcon();
                }).catch(e => console.error("再生エラー:", e));
            }

            // 一時停止処理も単一のエントリポイントに集約
            pause() {
                if (!this.isPlaying) return; // 二重停止を防止
                this.audio.pause();
                this.video.pause();
                // 一時停止した位置は保持して、再開時にそこから続ける
                this.isPlaying = false;
                this.video.style.opacity = '0';
                updatePlayPauseIcon();
            }

            // 再生/一時停止のトグル処理
            toggle() {
                this.isPlaying ? this.pause() : this.play();
            }

            // 曲の切り替え処理も内部化
            playNext() {
                const wasPlaying = this.isPlaying;
                this.pause();
                this.currentSongIndex = (this.currentSongIndex + 1) % songs.length;
                this.loadSong(this.currentSongIndex);
                if (wasPlaying) this.play();
            }

            playPrev() {
                const wasPlaying = this.isPlaying;
                this.pause();
                this.currentSongIndex = (this.currentSongIndex - 1 + songs.length) % songs.length;
                this.loadSong(this.currentSongIndex);
                if (wasPlaying) this.play();
            }

            // 曲の読み込み処理も内部化
            loadSong(songIndex) {
                const song = songs[songIndex];
                this.audio.src = song.src;
                albumArt.src = song.cover;
                songTitle.textContent = song.title;
                songTitle.href = song.url;
                if (song.video) {
                    this.video.src = song.video;
                    this.video.load();
                    this.video.currentTime = 0;
                }
                this.audio.load();
                this.progress.style.width = '0%';
                this.audio.onloadedmetadata = () => {
                    if (!isNaN(this.audio.duration) && this.audio.duration > 0) {
                        this.displayedTotalDuration = this.audio.duration;
                        timeDisplay.textContent = `0:00 / ${formatTime(this.displayedTotalDuration)}`;
                    }
                };
            }
        }

        // プレーヤーインスタンスを1つだけ生成して一元管理（Spotifyと同じ構造）
        const player = new MediaPlayer();

        function updatePlayPauseIcon() {
            if (audioPlayer.paused) {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            } else {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            }
        }

        // Initial load (Spotify風の初期化処理)
        player.loadSong(player.currentSongIndex);
        audioPlayer.volume = volumeSlider.value;
        updatePlayPauseIcon();
        player.pause(); // 初期状態で必ず停止状態に
        
        // 曲名クリックでその曲の外部ページに移動するイベントを設定
         document.getElementById('song-title').addEventListener('click', function(e) {
             e.preventDefault(); // デフォルトのリンク動作をキャンセル
             const currentSong = songs[currentSongIndex];
             if (currentSong.url) {
                 window.open(currentSong.url, '_blank'); // 新しいタブで開く
             }
         });

        // 自動再生を無効化 - ユーザーの操作後に再生開始

    // ローディング画面を非表示にする
    window.addEventListener('load', function() {
        setTimeout(function() {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('hidden');
        }, 800); // 最低でも0.8秒間表示してスムーズな遷移にする
    });

        // --- Volume Control --->
        let lastVolume = 0.6; // デフォルト音量を60%に設定
        audioPlayer.volume = 0.6; // 初期音量を60%に設定

        function updateVolumeIcon() {
            if (audioPlayer.muted || audioPlayer.volume === 0) {
                volumeOn.classList.add('hidden');
                volumeOff.classList.remove('hidden');
            } else {
                volumeOn.classList.remove('hidden');
                volumeOff.classList.add('hidden');
            }
        }

        muteToggle.addEventListener('click', () => {
            if (audioPlayer.muted) {
                audioPlayer.muted = false;
                if (audioPlayer.volume === 0) {
                    audioPlayer.volume = lastVolume;
                }
            } else {
                if (audioPlayer.volume > 0) {
                    lastVolume = audioPlayer.volume;
                }
                audioPlayer.muted = true;
            }
            const newSliderValue = audioPlayer.muted ? 0 : audioPlayer.volume;
            volumeSlider.value = newSliderValue;
            const percent = newSliderValue * 100;
            volumeSlider.style.setProperty('--value-percent', `${percent}%`);
            updateVolumeIcon();
        });

        volumeSlider.addEventListener('input', (e) => {
            const newVolume = parseFloat(e.target.value);
            audioPlayer.volume = newVolume;
            audioPlayer.muted = newVolume === 0;
            const percent = newVolume * 100;
            e.target.style.setProperty('--value-percent', `${percent}%`);
            if (newVolume > 0) {
                lastVolume = newVolume;
            }
            updateVolumeIcon();
        });

        function setInitialVolumeState() {
            const initialSliderValue = audioPlayer.muted ? 0 : audioPlayer.volume;
            const initialPercent = initialSliderValue * 100;
            volumeSlider.value = initialSliderValue;
            volumeSlider.style.setProperty('--value-percent', `${initialPercent}%`);
            updateVolumeIcon();
        }
        setInitialVolumeState();

        // --- Music Player Play/Pause (Spotify風の単一エントリポイント) ---
        playPauseBtn.addEventListener('click', () => player.toggle());
        prevBtn.addEventListener('click', () => player.playPrev());
        nextBtn.addEventListener('click', () => player.playNext());

        // --- ページの可視性変更時の処理（別タブに移動して戻った時のカクつき対策）---
        document.addEventListener('visibilitychange', () => {
            // ページが再び表示された時
            if (document.visibilityState === 'visible') {
                // 再生中だった場合、再生を再開して位置を同期
                if (!audioPlayer.paused) {
                    // 動画が停止していたら再生を再開
                    if (backgroundVideo.paused) {
                        // 音声と動画の位置を再同期してから再生
                        const currentAudioTime = audioPlayer.currentTime;
                        if (Math.abs(backgroundVideo.currentTime - currentAudioTime) > 0.5) {
                            backgroundVideo.currentTime = currentAudioTime;
                        }
                        backgroundVideo.play().catch(e => console.log("可視性復帰時の再生エラー:", e));
                    }
                }
            } else {
                // ページが非表示になった時は特に処理せず、ブラウザの制御に任せる
            }
        });

        // --- Progress Bar and Time Display ---










        // Initialize time display
        if (!isNaN(audioPlayer.duration)) {
            timeDisplay.textContent = `0:00 / ${formatTime(audioPlayer.duration)}`;
        }

        // --- 3D Tilt Effect ---
        function applyTilt(e) {
            const event = e.touches ? e.touches[0] : e;
            const { clientX, clientY } = event;
            const { innerWidth, innerHeight } = window;
            const x = (clientX / innerWidth - 0.5) * 2;
            const y = (clientY / innerHeight - 0.5) * 2;
            const rotateX = y * -15;
            const rotateY = x * 15;
            container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            avatar.style.transform = `translateZ(50px)`;
            title.style.transform = `translateZ(30px)`;
            links.style.transform = `translateZ(20px)`;
        }

        function resetTilt() {
            container.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            avatar.style.transform = 'translateZ(0px)';
            title.style.transform = 'translateZ(0px)';
            links.style.transform = 'translateZ(0px)';
        }

        document.addEventListener('mousemove', applyTilt);
        document.addEventListener('mouseleave', resetTilt);
        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            applyTilt(e);
        }, { passive: false });
        document.addEventListener('touchend', resetTilt);

        // --- Scroll Control ---
        let currentCardIndex = 0;
        let isScrolling = false;
        const scrollDuration = 1000;

        function smoothScrollTo(targetY) {
            const startY = scrollContainer.scrollTop;
            const distance = targetY - startY;
            let startTime = null;

            function animation(currentTime) {
                if (startTime === null) startTime = currentTime;
                const timeElapsed = currentTime - startTime;
                const run = ease(timeElapsed, startY, distance, scrollDuration);
                scrollContainer.scrollTop = run;
                if (timeElapsed < scrollDuration) requestAnimationFrame(animation);
            }

            function ease(t, b, c, d) {
                t /= d / 2;
                if (t < 1) return c / 2 * t * t + b;
                t--;
                return -c / 2 * (t * (t - 2) - 1) + b;
            }

            requestAnimationFrame(animation);
        }

        function scrollToCard(index) {
            if (isScrolling || index < 0 || index >= cards.length) return;
            isScrolling = true;
            currentCardIndex = index;
            const targetY = cards[index].offsetTop;
            smoothScrollTo(targetY);
            navLinks.forEach((link, i) => {
                link.classList.toggle('active', i === index);
            });
            // URLのハッシュを更新して、現在のカードと同期させる
            history.pushState(null, '', `#card-${index + 1}`);
            // 現在のカードインデックスをlocalStorageに保存
            localStorage.setItem('lastViewedCardIndex', index);
            setTimeout(() => {
                isScrolling = false;
            }, scrollDuration);
        }

        scrollContainer.addEventListener('wheel', function(e) {
            e.preventDefault();
            if (isScrolling) return;
            if (e.deltaY > 0) {
                scrollToCard(currentCardIndex + 1);
            } else {
                scrollToCard(currentCardIndex - 1);
            }
        }, { passive: false });

        // --- Swipe Controls for Mobile ---
        let touchStartY = 0;
        scrollContainer.addEventListener('touchstart', function(e) {
            if (isScrolling) return;
            touchStartY = e.touches[0].clientY;
        });

        scrollContainer.addEventListener('touchmove', function(e) {
            // Prevent the browser's default vertical scroll to avoid conflicts
            e.preventDefault();
        }, { passive: false });

        scrollContainer.addEventListener('touchend', function(e) {
            if (isScrolling) return;
            const touchEndY = e.changedTouches[0].clientY;
            const swipeDistance = touchStartY - touchEndY;
            const swipeThreshold = 50; // Minimum distance for a swipe

            if (swipeDistance > swipeThreshold) {
                // Swiped Up
                scrollToCard(currentCardIndex + 1);
            } else if (swipeDistance < -swipeThreshold) {
                // Swiped Down
                scrollToCard(currentCardIndex - 1);
            }
        });


        navLinks.forEach((link, index) => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                scrollToCard(index);
            });
        });
        // ページ読み込み時に初期化関数を呼び出す
        function initializeActiveCard() {
            let initialIndex = 0; // 常にcard-1 (インデックス0) に初期化

            console.log('initializeActiveCard: initialIndex determined:', initialIndex); // Debug log
            // Log offsetTop for all cards to verify
            cards.forEach((card, idx) => {
                console.log(`Card ${idx} offsetTop:`, card.offsetTop);
            });

            // 一時的にscroll-snap-typeを無効にする
            const originalScrollSnapType = scrollContainer.style.scrollSnapType;
            scrollContainer.style.scrollSnapType = 'none';

            // アニメーションなしで直接スクロール位置を設定
            console.log('initializeActiveCard: Target card offsetTop at scroll set:', cards[initialIndex].offsetTop);
            scrollContainer.scrollTop = cards[initialIndex].offsetTop;
            console.log('initializeActiveCard: scrollContainer.scrollTop set to:', scrollContainer.scrollTop); // Debug log

            // ナビゲーションドットのアクティブ状態を更新
            navLinks.forEach((link, idx) => {
                // 一時的にトランジションを無効にする
                link.style.transition = 'none';
                if (idx === initialIndex) {
                    link.classList.add('active');
                    console.log('initializeActiveCard: Setting active class for link index:', idx); // Debug log
                } else {
                    link.classList.remove('active');
                }
                // 短い遅延の後でトランジションを元に戻す
                setTimeout(() => {
                    link.style.transition = ''; // CSSで定義されたトランジションに戻す
                }, 50); // わずかな遅延
            });
            currentCardIndex = initialIndex; // 現在のカードインデックスをグローバル変数に設定
            console.log('initializeActiveCard: currentCardIndex set to:', currentCardIndex); // Debug log

            // URLのハッシュを更新して、常にcard-1と同期させる
            history.replaceState(null, '', `#card-${initialIndex + 1}`);

            // 短い遅延の後でscroll-snap-typeを元に戻す
            setTimeout(() => {
                scrollContainer.style.scrollSnapType = originalScrollSnapType;
            }, 100); // スクロールが落ち着くのを待つための短い遅延
            scrollContainer.style.overflowY = 'scroll';
            scrollContainer.style.visibility = 'visible';
        }
        initializeActiveCard();





        // --- Clock ---
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // デジタル時刻表示 (24時間形式)
            const digitalHours = String(hours).padStart(2, '0');
            const digitalMinutes = String(minutes).padStart(2, '0');
            const digitalSeconds = String(seconds).padStart(2, '0');
            document.getElementById('digital-time').textContent = `${digitalHours}:${digitalMinutes}:${digitalSeconds}`;

            // アナログ時計の針
            const hourHand = document.querySelector('.hour');
            const minuteHand = document.querySelector('.minute');
            const secondHand = document.querySelector('.second');

            // 各針の回転角度を計算
            const hourDeg = ((hours % 12) * 30) + (minutes * 0.5);
            const minuteDeg = (minutes * 6) + (seconds * 0.1);
            const secondDeg = seconds * 6;

            if (hourHand) hourHand.style.transform = `rotate(${hourDeg}deg)`;
            if (minuteHand) minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
            if (secondHand) secondHand.style.transform = `rotate(${secondDeg}deg)`;

            // 日付表示 (日本語形式)
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('ja-JP', dateOptions); // 日本語に設定
        }
        setInterval(updateClock, 1000);
        updateClock(); // 初回呼び出し

        // 時計マーククリックで時計コンテナの表示/非表示をトグル
        const clockToggle = document.getElementById('clock-toggle');
        const clockContainer = document.getElementById('clock-container');
        clockToggle.addEventListener('click', () => {
            clockContainer.classList.toggle('visible');
        });

        window.addEventListener('keydown', function(e) {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
        });


  </script>
